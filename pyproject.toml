[project]
name = "chisco"
version = "0.1.0"
description = "Chisco: EEG preprocessing pipeline and imagined-speech decoding baselines"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
license-files = ["LICENSE"]

# EEG 预处理 + 分析（论文声明的版本已钉住）
dependencies = [
    "mne==1.6.0",
    "mne-icalabel==0.6.0",
    "pyprep==0.4.3",
    "autoreject==0.4.3",
    # MNE 1.6.0 不兼容 NumPy 2.x，必须锁在 1.x
    "numpy==1.26.4",
    "scipy==1.15.3",
    "pandas==2.3.3",
    "matplotlib==3.10.9",
    "openpyxl==3.1.5",
    # mne-icalabel 的 ICLabel 推理依赖 torch；只跑预处理可改装 CPU 版
    "torch==2.14.1",
]

# 模型训练/推理（EEGclassify.py、data_imagine.py）
[project.optional-dependencies]
train = [
    "transformers",
    "scikit-learn",
    "mat73",
]

# 本仓库是脚本集合而非可安装包，避免 uv 尝试构建打包
[tool.uv]
package = false